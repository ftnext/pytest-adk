[project]
name = "pytest-adk"
version = "0.0.7"
description = "Helpers for testing agents with Google's adk-python"
readme = "README.md"
authors = [
    { name = "ftnext", email = "takuyafjp+develop@gmail.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "google-adk>=1.30.0,<3",
    # Minimal subset of google-adk's [eval] extra needed to actually run
    # evaluations (importing LocalEvalService requires pandas;
    # response_match_score requires rouge-score; detailed result tables
    # require tabulate). The full [eval] extra is avoided because it pulls in
    # heavyweight dependencies such as gepa and
    # google-cloud-aiplatform[evaluation]. Note: on google-adk v2, importing
    # LocalEvalService additionally requires google-cloud-aiplatform (base is
    # enough); pytest-adk does not force it on users and surfaces google-adk's
    # own guidance instead.
    "pandas>=2.2.3",
    "rouge-score>=0.1.2",
    "tabulate>=0.9",
    'tomli; python_version < "3.11"',
    "tomli-w",
]

[project.optional-dependencies]
jinja = [
    "jinja2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "jinja2",
    # google-adk v2's LocalEvalService import chain needs the vertexai module
    # (base google-cloud-aiplatform), so tests that run real evaluations
    # require it. Not a runtime dependency of pytest-adk itself.
    "google-cloud-aiplatform",
]

[project.scripts]
pytest-adk = "pytest_adk.cli:main"
pytest-adk-eval-schema = "pytest_adk.template:main"

[project.entry-points.pytest11]
pytest_adk = "pytest_adk.plugin"

[tool.pytest]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.envs.test-adk1]
installer = "uv"
features = ["jinja"]
dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "google-adk>=1.30.0,<2",
]
[tool.hatch.envs.test-adk1.scripts]
run = "pytest {args}"

[tool.hatch.envs.test-adk2]
installer = "uv"
features = ["jinja"]
dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "google-adk>=2,<3",
    "google-cloud-aiplatform",
]
[tool.hatch.envs.test-adk2.scripts]
run = "pytest {args}"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[project.urls]
Repository = "https://github.com/ftnext/pytest-adk"
