[project]
name = "pytest-adk"
version = "0.0.10"
description = "Helpers for testing agents with Google's adk-python"
readme = "README.md"
authors = [
    { name = "ftnext", email = "takuyafjp+develop@gmail.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "google-adk>=1.30.0,<3",
    # Minimal subset of google-adk's [eval] extra needed to actually run
    # evaluations (importing LocalEvalService requires pandas;
    # response_match_score requires rouge-score; detailed result tables
    # require tabulate). The full [eval] extra is avoided because it pulls in
    # heavyweight dependencies such as gepa and
    # google-cloud-aiplatform[evaluation].
    "pandas>=2.2.3",
    "rouge-score>=0.1.2",
    "tabulate>=0.9",
    # On google-adk v2, LocalEvalService's import chain imports `vertexai` as
    # an import-time side effect of building the default metric registry,
    # even though pytest-adk never calls Vertex AI itself. google-adk v1
    # already depends on `google-cloud-aiplatform[agent-engines]>=1.148.1,<2`,
    # so this only adds packages for v2 users; the base package is enough (the
    # `[evaluation]` extra is not needed). Floor and cap match google-adk's
    # own bounds.
    "google-cloud-aiplatform>=1.148.1,<2",
    'tomli; python_version < "3.11"',
    "tomli-w",
]

[project.optional-dependencies]
jinja = [
    "jinja2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "jinja2",
]

[project.scripts]
pytest-adk = "pytest_adk.cli:main"
pytest-adk-eval-schema = "pytest_adk.template:main"

[project.entry-points.pytest11]
pytest_adk = "pytest_adk.plugin"

[tool.pytest]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.envs.test-adk1]
installer = "uv"
features = ["jinja"]
dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "google-adk>=1.30.0,<2",
]
[tool.hatch.envs.test-adk1.scripts]
run = "pytest {args}"

[tool.hatch.envs.test-adk2]
installer = "uv"
features = ["jinja"]
dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "google-adk>=2,<3",
]
[tool.hatch.envs.test-adk2.scripts]
run = "pytest {args}"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[project.urls]
Repository = "https://github.com/ftnext/pytest-adk"
